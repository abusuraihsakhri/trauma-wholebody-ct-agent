name: Python tests and syntax checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Python compile check
        run: python -m compileall -q agents trauma_wholebody_ct_agent cli.py trauma_scan_sentinel.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Browser script syntax
        run: |
          python -c "from pathlib import Path; x=Path('web/index.html').read_text(); Path('/tmp/trauma-demo.js').write_text(x.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/trauma-demo.js
